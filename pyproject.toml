[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eduwisp-api"
version = "0.0.1"
description = "EduWISP: API JSON per le app mobili (personale, famiglie, studenti), con gli stessi permessi del portale"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.13"
authors = [{ name = "Michele Salerno e i contributori di EduWISP" }]
dependencies = ["Django>=5.2,<5.3", "djangorestframework>=3.16", "eduwisp-users", "eduwisp-school", "eduwisp-devices", "eduwisp-apps", "eduwisp-audit"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.9"]

[project.urls]
Homepage = "https://github.com/EduWISP/eduwisp-api"
Documentation = "https://eduwisp.org/docs/"

[tool.setuptools.packages.find]
include = ["eduwisp_api*"]

[tool.setuptools.package-data]
eduwisp_api = ["locale/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
